app_settings:
  port: 8000
  # service_prefix: None
  # stylesheet: None
  enable_logging: false
  logging_level: warning
  log_to_file: false
  variableselector:
    refnr: refnr
    ident: ident
    grouping_variables:
      - altinnskjema
      - variabel
    time_units:
        name: aar
        frequency: year
  connection:
    type: postgres
    database_url: test
modules:
  tabs:
    - type: DataEditor
      settings:
        starting_table: "skjemadata"
        form_data_table: "skjemadata"
        form_list:
          - "RA-0187"
        period_col: "iso_period"
        ident_col: "ident"
        refnr_col: "refnr"
        form_name_col: "skjema"
        field_name_col: "feltsti"
        field_value_col: "verdi"
      data_handler: StandardDataHandler
      inforow:
      buttons:
        - type: DataEditorHistory
        - type: DataEditorSupportTables
      sidebar:
        - type: DataEditorSidebarEditingStatus
        - type: DataEditorSidebarComment
      dataview:
        - type: DataEditorTable
          applies_to_tables: ["skjemadata"]
          applies_to_forms: ["ra_xxxx"]
        - type: DataViewCustom
          applies_to_tables: ["skjemadata"]
          applies_to_forms: ["ra_yyyy"]
          layout:
            # layout here
